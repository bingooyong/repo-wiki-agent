name: repo-wiki-pilot

on:
  push:
    branches: [feature/*, pilot/*]
  pull_request:

permissions: read-all

env:
  PROFILE: pilot
  EVIDENCE_DIR: .repo-agent-eval/pilot-${{ github.run_id }}

jobs:
  verify-and-compare:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install repo-wiki
        run: uv pip install --system -e .

      - name: Generate artifacts
        run: python -m repo_wiki.main init

      - name: Run verify (pilot mode)
        id: verify
        run: |
          python -m repo_wiki.main verify --ci --profile pilot > verify-result.json || true
          cat verify-result.json

      - name: Run baseline compare (pilot)
        id: compare
        run: |
          python -m scripts.qoder_baseline_comparison \
            --target docs/ \
            --baseline qoder-style/ \
            --output compare-result.json || true

      - name: Collect pilot metrics
        run: |
          mkdir -p ${{ env.EVIDENCE_DIR }}
          cp verify-result.json ${{ env.EVIDENCE_DIR }}/ 2>/dev/null || echo "{}" > ${{ env.EVIDENCE_DIR }}/verify-result.json
          cp compare-result.json ${{ env.EVIDENCE_DIR }}/ 2>/dev/null || echo "{}" > ${{ env.EVIDENCE_DIR }}/compare-result.json

          # Generate pilot metrics summary
          python3 - <<'PY' > ${{ env.EVIDENCE_DIR }}/pilot-metrics.json || echo '{}' > ${{ env.EVIDENCE_DIR }}/pilot-metrics.json
          import json
          import os

          try:
              with open("verify-result.json", encoding="utf-8") as handle:
                  verify = json.load(handle)
              compare = {}
              if os.path.exists("compare-result.json"):
                  with open("compare-result.json", encoding="utf-8") as handle:
                      compare = json.load(handle)
              metrics = {
                  "profile": "pilot",
                  "verify_exit_code": verify.get("exit_code", -1),
                  "verify_grade": verify.get("grade", "UNKNOWN"),
                  "hard_gate_failures": verify.get("summary", {}).get("hard_gate_failures", 0),
                  "soft_gate_failures": verify.get("summary", {}).get("soft_gate_failures", 0),
                  "overall_score": (
                      compare.get("summary", {}).get("overall_score", 0) if compare else 0
                  ),
                  "pilot_repos": ["repo-agent", "reference-repo"],
              }
              print(json.dumps(metrics, indent=2))
          except Exception as exc:
              print(json.dumps({"error": str(exc)}))
          PY

      - name: Upload evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-bundle-pilot-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}

      - name: Log decision (pilot allows failures)
        run: |
          bash ci/scripts/decision.sh --profile pilot \
            --verify verify-result.json \
            --compare compare-result.json \
            --evidence ${{ env.EVIDENCE_DIR }} \
            --allow-continue || true