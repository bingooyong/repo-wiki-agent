name: repo-wiki-strict

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

env:
  PROFILE: strict
  EVIDENCE_DIR: .repo-agent-eval/strict-${{ github.run_id }}

jobs:
  verify-and-compare:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install repo-wiki
        run: uv pip install --system -e .

      - name: Generate artifacts
        run: python -m repo_wiki.main init

      - name: Run verify (strict mode)
        id: verify
        run: |
          python -m repo_wiki.main verify --ci --profile strict > verify-result.json || true
          cat verify-result.json
          echo "exit_code=$(python -c 'import json; print(json.load(open("verify-result.json"))["exit_code"])')" >> $GITHUB_OUTPUT

      - name: Run baseline compare
        id: compare
        run: |
          python -m scripts.qoder_baseline_comparison --target docs/ --baseline qoder-style/ --output compare-result.json || true
          cat compare-result.json || echo "{}"

      - name: Collect evidence
        run: |
          mkdir -p ${{ env.EVIDENCE_DIR }}
          cp verify-result.json ${{ env.EVIDENCE_DIR }}/ 2>/dev/null || echo "{}" > ${{ env.EVIDENCE_DIR }}/verify-result.json
          cp compare-result.json ${{ env.EVIDENCE_DIR }}/ 2>/dev/null || echo "{}" > ${{ env.EVIDENCE_DIR }}/compare-result.json

      - name: Upload evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-bundle-strict-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}

      - name: Decision gate
        run: |
          set -euo pipefail
          hard=$(python3 -c 'import json; print(int(json.load(open("verify-result.json")).get("summary", {}).get("hard_gate_failures", 0)))')
          if bash ci/scripts/decision.sh --profile strict \
            --verify verify-result.json \
            --compare compare-result.json \
            --evidence ${{ env.EVIDENCE_DIR }}; then
            echo "strict decision: APPROVED"
            exit 0
          fi
          if [ "$hard" -gt 0 ]; then
            echo "strict decision: blocking HARD failures=${hard}"
            exit 1
          fi
          echo "strict decision: SOFT-only rejection is non-blocking on this generator repo."
          echo "CLI verify --ci already treats these as WARN (exit 0)."
          echo "Production 0-soft remains a follow-up for published Wiki releases, not init templates."