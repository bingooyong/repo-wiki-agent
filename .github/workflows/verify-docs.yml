name: repo-wiki-verify

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Install repo-wiki
        run: uv pip install --system -e .

      - name: Generate artifacts
        run: python -m repo_wiki.main init

      - name: Verify governance
        run: |
          python -m repo_wiki.main verify --ci > verify-result.json
          cat verify-result.json

      - name: Upload verify result
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: verify-result
          path: verify-result.json
