name: repo-wiki-verify

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions: read-all

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install repo-wiki
        run: uv pip install --system -e .

      - name: Generate artifacts
        run: python -m repo_wiki.main init

      - name: Verify governance
        run: |
          python -m repo_wiki.main verify --ci > verify-result.json
          cat verify-result.json

      - name: Upload verify result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success() || failure()
        with:
          name: verify-result
          path: verify-result.json
