name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  stage0-contract-gate:
    name: Stage 0 contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run minimum fixture and contract regressions
        run: |
          pytest -q \
            tests/test_qoder_like_profile.py \
            tests/test_fixture_ingestion.py \
            tests/test_benchmark_matrix.py \
            tests/test_large_repo_fixture.py \
            tests/test_large_repo_benchmark.py \
            tests/test_cli_config_doctor.py \
            tests/test_llm_config.py \
            tests/test_eval_manifest.py \
            tests/test_release_meta_schema.py \
            tests/test_cli_qoder_like.py \
            tests/test_codex_plugin_package.py \
            tests/test_codex_plugin_workflow.py \
            tests/test_codex_plugin_smoke.py \
            tests/test_host_loop_contract.py \
            tests/test_secret_sentinel_artifacts.py \
            tests/test_source_of_truth_contract.py \
            tests/test_stage0_ci_contract.py

      - name: Validate CLI configuration contract
        env:
          REPO_WIKI_CI_API_KEY: ci-config-placeholder
        run: >-
          python -m repo_wiki.main config --ci
          --provider openai
          --model ci-contract
          --api-key-env REPO_WIKI_CI_API_KEY

      - name: Scan tracked artifacts for secret-shaped literals
        run: >-
          python scripts/secret_sentinel_scan.py
          README.md docs .github repo_wiki scripts plugins .agents/plugins/marketplace.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy repo_wiki --ignore-missing-imports

      - name: Run tests
        run: pytest --cov=repo_wiki --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  docs-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install repo-wiki
        run: uv pip install --system -e .

      - name: Verify qoder-like eval artifacts
        run: |
          set -euo pipefail
          eval_root=".repo-agent-eval"
          if [ -f "${eval_root}/repowiki/zh/manifest.json" ]; then
            python -m repo_wiki.main verify --ci --profile qoder-like --output "${eval_root}"
          elif [ -d "${eval_root}/runs" ] && [ -n "$(find "${eval_root}/runs" -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            python -m repo_wiki.main verify --ci --profile qoder-like --output "${eval_root}"
          else
            echo "Skipping qoder-like verify: ${eval_root} is gitignored and not present on this checkout."
            echo "Product contract: qoder-like HARD gates apply to generated Wiki artifacts"
            echo "(repo-wiki verify --profile qoder-like --ci --output .repo-agent-eval),"
            echo "not to committed product docs under docs/."
            echo "Verifier logic is covered by pytest in the test job."
          fi
