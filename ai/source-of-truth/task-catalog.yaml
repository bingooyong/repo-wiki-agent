commands:
  init: repo-wiki init
  index: repo-wiki index
  update: repo-wiki update
  sync: repo-wiki sync
  search: repo-wiki search <query>
  graph: repo-wiki graph <module>
  generate: repo-wiki generate --profile qoder-like --output .repo-agent-eval
  verify: repo-wiki verify --profile qoder-like --ci --output .repo-agent-eval
  compare: repo-wiki compare --target <target-content-dir> --baseline <qoder-baseline-dir> --output <report-dir> --ci
  release_publish: repo-wiki release-publish --output .repo-agent-eval
  eval_layout_report: repo-wiki eval-layout-report --output .repo-agent-eval
  cost_estimate: repo-wiki cost-estimate
  config: repo-wiki config --ci
  extension_update_default: uv run repo-wiki generate --profile qoder-like

module_references:
  - repo_wiki
  - repo_wiki.orchestration
  - repo_wiki.verifier
  - repo_wiki.viewer
  - extensions/repo-wiki-browser
  - tests

tasks:
  - name: config-check
    description: Validate local non-secret LLM and output configuration before generation.
    commands:
      - repo-wiki config --ci
    verifies:
      - CLI configuration can be resolved without exposing API keys.

  - name: generate-qoder-like
    description: Generate a qoder-like run under the isolated eval layout.
    commands:
      - repo-wiki generate --profile qoder-like --output .repo-agent-eval
    outputs:
      - .repo-agent-eval/runs/<run-id>/manifest.json
      - .repo-agent-eval/runs/<run-id>/repowiki/zh/content
    verifies:
      - Run manifest records readiness fields and navigation_tree.
      - Content is kept under the eval output root, not source directories.

  - name: verify-qoder-like
    description: Run strict qoder-like verification against a run or release candidate.
    commands:
      - repo-wiki verify --profile qoder-like --ci --output .repo-agent-eval
    outputs:
      - strict verify JSON result
    verifies:
      - FAIL or NOT_READY exits non-zero in CI mode.
      - PASS/READY run can proceed to compare and release checks.

  - name: compare-qoder-baseline
    description: Compare generated content against a Qoder baseline and emit readiness evidence.
    commands:
      - repo-wiki compare --target <target-content-dir> --baseline <qoder-baseline-dir> --output <report-dir> --ci
    outputs:
      - qoder-comparison-report.json
      - qoder-comparison-report.md
    verifies:
      - Comparison status is READY before release publication.

  - name: inspect-eval-layout
    description: Diagnose canonical versus legacy qoder-like run layouts before publishing.
    commands:
      - repo-wiki eval-layout-report --output .repo-agent-eval
    verifies:
      - Canonical content root is repowiki/zh/content under each run.
      - Legacy/direct content roots are visible as diagnostics only.

  - name: publish-ready-release
    description: Atomically publish a READY qoder-like run to the stable release path consumed by viewers and the extension.
    commands:
      - repo-wiki release-publish --output .repo-agent-eval
    outputs:
      - .repo-agent-eval/repowiki/zh/manifest.json
      - .repo-agent-eval/repowiki/zh/content
      - .repo-agent-eval/repowiki/zh/meta/release.json
      - .repo-agent-eval/release-history.json
    readiness_symbols:
      - READY
      - release_status
      - readiness
      - readiness_state
      - navigation_tree
    verifies:
      - Release manifest exposes release_status/readiness READY and navigation_tree.
      - Existing release is not modified when the candidate is not READY.

  - name: extension-browse-ready-release
    description: Browse the stable READY release from VS Code/Cursor.
    commands:
      - repoWikiBrowser.openViewer
      - repoWikiBrowser.refreshTree
      - repoWikiBrowser.runVerify
      - repoWikiBrowser.updateWiki
      - repoWikiBrowser.syncWiki
    inputs:
      - .repo-agent-eval/repowiki/zh/manifest.json
    verifies:
      - Sidebar reads the fixed release manifest and does not fall back to run directories.
      - Update Wiki sends the configured repoWikiBrowser.generateCommand in an integrated terminal.
